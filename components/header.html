<header class="header">
	<div class="header-left">
		<img src="/img/logo_nr.PNG" class="logo">
		<h3 class="header-title">
			CERCLE NUMISMATIQUE DE NÎMES
		</h3>
	</div>
	<div class="header-right">
		<nav class="header-nav desktop-menu">
			<ul>
				<li class="btn"><a href="/index.html" class="nav-link">Accueil</a></li>
				<li class="btn"><a href="/articles.html" class="nav-link">Articles</a></li>
				<li class="btn"><a href="/about.html" class="nav-link">à propos</a></li>
			</ul>
		</nav>
	</div>
	<!-- Mobile Menu -->
	<button class="menu-toggle">
		<i class="fa-solid fa-bars"></i>
	</button>
	
	<div class="mobile-overlay"></div>

	<nav class="mobile-menu">
		<button class="close-menu">
			<i class="fa-solid fa-xmark"></i>
		</button>
		<ul>
			<li class="btn"><a class="nav-link" href="/index.html">Accueil</a></li>
			<li class="btn"><a class="nav-link" href="/articles.html">Articles</a></li>
			<li class="btn"><a class="nav-link" href="/about.html">À propos</a></li>
		</ul>

    </nav>

	<style class="header-style">
		.header{
			position: relative;
			background-color: #F1D2A7;
			padding: 2rem 2rem;
			display: flex;
			align-items: center;
		}

		.side-menu{
			display: none;
		}

		.header-left{
			width: 45%;
			display: flex;
			gap: 2rem;
			align-items: center;
		}

		.header-right{
			width: 54%;
			text-align : right;
			align-content: center;
		}

		.header-title{
			text-align: left;
			font-family: Garamond;
			font-size: 2rem;
		}

		.header .logo{
			width: 5rem;
			height: 5rem;
		}

		.header-nav .btn{
			list-style-type: none;
			display: inline-block;
			text-align: right;
			padding-inline: 1rem;
			font-family: Montserrat;
			font-weight: bold;
			text-transform: uppercase;
		}

		.header-nav .nav-link {
			color: #4F4F4F;
			text-decoration: none;
			border-bottom: 0.2rem solid #4F4F4F;
			text-transform: uppercase;
		}

		.header-nav .nav-link:hover {
			color: #2B2B2B;
			transition: 0.5s all;
			font-weight: bold;
			border-bottom: 0.2rem solid #2B2B2B;
		}

		.header-nav .nav-link.active {
			color: #000000;
			text-decoration: none;
			border-bottom: 0.2rem solid #000000;
			text-transform: uppercase;
		}

		.menu-toggle{
			display: none;
			position: absolute;
			right: 4rem;
			top: 40%;
			transform: translateY(-60%);
			background: none;
			border: none;
			color: #000000;
			font-size: 2rem;
			cursor: pointer;
			z-index: 1100;
		}

		.mobile-overlay {
			position:fixed;
			inset:0;
			background:rgba(0,0,0,0.2);
			opacity:0;
			visibility:hidden;
			transition:.3s;
			z-index:1000;
			pointer-events: none;
		}

		.mobile-menu {
			position:fixed;
			top:0;
			right:-100%;
			width:100%;
			height:100vh;
			background:rgba(0,0,0,0.6);
			z-index:2000;
			transition:.3s;
			padding:200px 60px;
			pointer-events: auto;
		}

		.mobile-menu a {
			position: relative;
			z-index: 3000;
			cursor:pointer;
			pointer-events: auto;
		}

		.mobile-menu .btn{
			list-style-type: none;
			text-align: center;
			padding: 1rem;
			font-family: Montserrat;
			font-weight: bold;
			text-transform: uppercase;
		}

		.mobile-menu .nav-link {
			color: #bebebe;
			text-decoration: none;
			border-bottom: 0.2rem solid #bebebe;
			text-transform: uppercase;
		}

		.mobile-menu .nav-link.active {
			color: #ffffff;
			text-decoration: none;
			border-bottom: 0.2rem solid #ffffff;
			text-transform: uppercase;
		}

		.close-menu {
			position:absolute;
			top:1rem;
			right:1rem;
			background:none;
			border:none;
			color:white;
			font-size:2rem;
		}

		@media(max-width: 1000px){
			
			.header-title{
			font-size: 1.5rem;
			}

			.desktop-menu {
				display:none;
			}

			.menu-toggle {
				display:block;
			}

			body.menu-open {
				overflow:hidden;
			}

			body.menu-open .mobile-overlay {
				opacity:1;
				visibility:visible;
				pointer-events: auto;
			}

			body.menu-open .mobile-menu {
				right:0;
			}
			.mobile-menu ul, .mobile-menu li, .mobile-menu a{
				z-index: 10000;
			}

		}
		@media(max-width:768px){
			
			.header-title{
			font-size: 1.5rem;
			display: none;
			}
			.header .logo{
			width: 5rem;
			height: 5rem;
			}

			.desktop-menu {
				display:none;
			}

			.menu-toggle {
				display:block;
			}

			body.menu-open {
				overflow:hidden;
			}

			body.menu-open .mobile-overlay {
				opacity:1;
				visibility:visible;
				pointer-events: auto;
			}

			body.menu-open .mobile-menu {
				right:0;
			}
			.mobile-menu ul, .mobile-menu li, .mobile-menu a{
				z-index: 10000;
			}

		}


	</style>
</header>
