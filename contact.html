<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" type="text/css" href="css/styles.css">
	<link rel="stylesheet" type="text/css" href="css/styles_phone.css">
	<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
	<title>Cercle Numismatique de Nîmes</title>
	<link rel="icon" type="image/jpg" href="img/logo_blc.ico">
</head>
<body>
	<div id="header"></div>
	<main class="site-body">
		<h2 class="page-title">
		Contact
		</h2>
		<div class="main">

			<!-- COLONNE GAUCHE -->
			<div class="left">
				<h3 class="subtitle">Notre lieu de réunion</h3>
				<iframe class="map" src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2877.794156479643!2d4.3565786752092555!3d43.83936587109396!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x12b42d0b003fb42d%3A0x4f3e92437ddb2014!2s6%20Rue%20des%20Halles%2C%2030000%20N%C3%AEmes!5e0!3m2!1sfr!2sfr!4v1773743023542!5m2!1sfr!2sfr" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
				<h5 class="sub-subtitle">
					Banque Populaire du Sud, 6 Rue des Halles, 30000 Nîmes
				</h5>
			</div>

			<!-- COLONNE DROITE -->
			<div class="right">
				<h3 class="subtitle">Contactez-nous</h3>

				<form class="form" id="contact-form" action="https://formspree.io/f/mgopwqqy" method="POST">

					<div class="row">
						<div class="group">
							<label>Prénom *</label>
							<input type="text" name="Prénom" required placeholder="Ernest">
						</div>
						<div class="group">
							<label>Nom *</label>
							<input type="text" name="Nom" required placeholder="Babelon">
						</div>
					</div>

					<div class="row">
						<div class="group">
							<label>Email *</label>
							<input type="email" name="Email" required placeholder="ernest.babelon@numismatique.fr">
						</div>
						<div class="group">
							<label>Téléphone *</label>
							<div class="phone">
								<input type="phone" placeholder="0601020304" name="Numéro" required>
							</div>
						</div>
					</div>

					<div class="group">
						<label>Message *</label>
						<textarea name="Message" required placeholder="Bonjour, je voudrais assister à une de vos réunion comment faire ?"></textarea>
					</div>

					<button class="base-btn" type="submit">
						Envoyer votre message
					</button>
					
					<p id="status"></p>

				</form>
			</div>
		</div>
	</main>
	<div id="footer"></div>

	<script type="text/javascript" src="components/components.js"></script>
	<script class="Message">
		const form = document.getElementById("contact-form");
		const status = document.getElementById("status");
		const button = document.querySelector("button[type='submit']");

		form.addEventListener("submit", async function(e) {
		  e.preventDefault();

		  button.disabled = true;
		  button.textContent = "Envoi en cours...";

		  const data = new FormData(form);

		  try {
			const response = await fetch(form.action, {
			  method: form.method,
			  body: data,
			  headers: {
				'Accept': 'application/json'
			  }
			});

			if (response.ok) {
			  status.innerHTML = "✅ Message envoyé avec succès !";
			  form.reset();
			} else {
			  status.innerHTML = "❌ Une erreur est survenue.";
			}
		  } catch (error) {
			status.innerHTML = "❌ Problème de connexion.";
		  }

		  button.disabled = false;
		  button.textContent = "Envoyer";
		});
	</script>
</body>
